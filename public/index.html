<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Node.js TypeScript Boilerplate</title>
  
  <!-- PWA Meta Tags -->
  <meta name="description" content="Node.js TypeScript Boilerplate with Prisma ORM">
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Node.js App">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16x16.png">
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    p { font-size: 1.2rem; opacity: 0.9; margin-bottom: 2rem; }
    .links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    a {
      color: #fff;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border: 2px solid #fff;
      border-radius: 8px;
      transition: all 0.3s;
    }
    a:hover { background: #fff; color: #667eea; }
    .offline-indicator {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background: #ff6b6b;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-size: 0.875rem;
      display: none;
    }
    .offline-indicator.show { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Node.js TypeScript Boilerplate</h1>
    <p>Your backend is running successfully!</p>
    <div class="links">
      <a href="/api">API Info</a>
      <a href="/health">Health Check</a>
    </div>
  </div>
  
  <div class="offline-indicator" id="offlineIndicator">You are offline</div>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(registration => {
            console.log('SW registered:', registration.scope);
          })
          .catch(error => {
            console.log('SW registration failed:', error);
          });
      });
    }

    // Offline/Online detection
    const offlineIndicator = document.getElementById('offlineIndicator');
    
    window.addEventListener('online', () => {
      offlineIndicator.classList.remove('show');
    });
    
    window.addEventListener('offline', () => {
      offlineIndicator.classList.add('show');
    });
    
    if (!navigator.onLine) {
      offlineIndicator.classList.add('show');
    }
  </script>
</body>
</html>
